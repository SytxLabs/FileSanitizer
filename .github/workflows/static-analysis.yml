name: Static analysis

on: [push]

jobs:
  phpstan:
    runs-on: ubuntu-latest
    name: PHPStan

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4

      - name: Install
        run: composer install --prefer-dist --no-interaction

      - name: PHPStan
        run: composer stan
